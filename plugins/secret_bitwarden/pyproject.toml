[project]
name = "hegemony-secret-bitwarden"
version = "0.3.6"
description = "Vaultwarden and Bitwarden vault secret backend plugin for Hegemony"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
dependencies = [
    "hegemony-secret-sdk==0.3.6",
    "cryptography>=50,<51",
    "httpx>=0.27,<1",
]

[project.entry-points."hegemony.secret_backends"]
bitwarden = "hegemony_secret_bitwarden:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_secret_bitwarden"
module-root = "src"
