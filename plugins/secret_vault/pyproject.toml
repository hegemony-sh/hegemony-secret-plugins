[project]
name = "hegemony-secret-vault"
version = "0.3.6"
description = "HashiCorp Vault and OpenBao secret backend plugin for Hegemony"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE-*.txt"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "hegemony-secret-sdk==0.3.6",
    "hvac>=2.3.0,<3.0",
]

[project.urls]
Homepage = "https://hegemony.sh"
Documentation = "https://hegemony.sh"
Source = "https://github.com/hegemony-sh/hegemony-secret-plugins"
Issues = "https://github.com/hegemony-sh/hegemony-secret-plugins/issues"
Changelog = "https://github.com/hegemony-sh/hegemony-secret-plugins/blob/main/CHANGELOG.md"

[project.entry-points."hegemony.secret_backends"]
vault = "hegemony_secret_vault:register"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hegemony_secret_vault"
module-root = "src"
