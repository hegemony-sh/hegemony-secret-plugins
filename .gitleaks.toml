# Gitleaks configuration -- extends the default ruleset, as the platform's
# (hegemony-sh/hegemony) .gitleaks.toml does.
# Docs: https://github.com/gitleaks/gitleaks#configuration
#
# No rule is disabled. The allowlist below is the platform's, for the same
# reason: public git commit SHAs are not credentials, but this repository's
# name contains the word "secret", and gitleaks' generic keyword rule
# (generic-api-key) keys on that word. A line that pairs the name with a 40-hex
# commit SHA, such as `"hegemony-secret-plugins": "<sha>"`, is reported as a
# credential, which is why the platform allowlists its .github/plugin-pins.json
# (commit SHAs keyed by the plugin repositories' names, this one among them).
#
# The only file here that records commit SHAs is CHANGELOG.md: semantic-release
# writes a link of the form
# https://github.com/hegemony-sh/hegemony-secret-plugins/commit/<sha> for every
# entry. gitleaks 8.21.2 (the version in .pre-commit-config.yaml) reads that
# form without complaint, and the tree and the whole history scan clean with the
# default ruleset alone, so the entry is a precaution: a change of changelog
# format, or a note that pairs the name with a SHA, cannot start a failing scan.
#
# The exception is one file, by path: every other file is still scanned, and a
# secret anywhere else still fails the scan. Do not disable generic-api-key and
# do not add a catch-all regex. If another file starts to record commit SHAs
# beside this repository's name, list that file here, with the reason.

[extend]
useDefault = true

[allowlist]
description = "Public git commit SHAs, not credentials"
paths = [
  # Generated by semantic-release on every release; see above.
  '''(^|/)CHANGELOG\.md$''',
]
